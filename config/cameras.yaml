# UI 프리뷰와 개별 카메라 검사에 사용하는 두 대의 RealSense 설정입니다.
# 이 이름(wrist/front)은 녹화 데이터셋의 observation.images.* 이름과 같아야 합니다.
cameras:
  wrist:
    label: "손목 카메라"
