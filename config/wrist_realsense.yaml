# 손목 장착 Intel RealSense D435i 설정
#
# 이 파일은 카메라만 다루며 xArm이나 GELLO에 연결하지 않습니다.
# 카메라 이름 "wrist"는 이후 데이터셋, 학습, pi0 추론에서 계속 같은 이름으로
# 사용할 예정입니다. 이름을 중간에 바꾸면 학습된 모델이 기대하는 입력 이름과
# 실제 카메라 입력 이름이 달라질 수 있습니다.

camera:
  name: wrist
  type: intelrealsense
  serial_number: "348522072411"
  width: 640
  height: 480
  fps: 30
  color_mode: rgb
  # pi0는 우선 RGB 영상만 입력으로 사용합니다. 깊이는 3D 좌표 계산을 별도로
  # 할 때만 필요하므로, 첫 시연 데이터에는 기록하지 않습니다.
  use_depth: false
  # 실제 화면이 거꾸로 보일 때만 사용자 확인 후 90/180/-90 중 하나로 바꿉니다.
  # 지금은 물리 장착 방향을 임의로 추정하지 않고 원본(0°)을 유지합니다.
  rotation_degrees: 0
